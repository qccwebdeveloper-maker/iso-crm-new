services:
  - type: web
    name: iso-crm-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
      - key: CORS_ORIGIN_VERCEL
        sync: false
      - key: CORS_ORIGIN_CRM_HTTP
        sync: false
      - key: CORS_ORIGIN_CRM_HTTPS
        sync: false
      - key: CORS_ORIGIN_QCC
        sync: false
      - key: CORS_ORIGIN_QCC_WWW
        sync: false
      - key: CORS_ALLOW_LOCALHOST
        sync: false
